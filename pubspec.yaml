name: tvoe_video
description: ReelMaker - создание видео из фото (Мир 5 вселенной Твой Magazine)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Video & Media
  video_player: ^2.8.2
  ffmpeg_kit_flutter: ^6.0.3
  image_picker: ^1.0.7
  path_provider: ^2.1.2

  # UI & Icons
  phosphor_flutter: ^2.0.1
  google_fonts: ^6.1.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  share_plus: ^7.2.2
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true